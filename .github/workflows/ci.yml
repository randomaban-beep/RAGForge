name: Tests and evaluation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m src.evaluation.run --min-recall 0.8 --out reports/ci
      - run: python -m src.evaluation.compare reports/demo/retrieval.json reports/ci/retrieval.json --max-drop 0.02
      - run: python -m src.evaluation.answers --out reports/ci/answers.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-reports
          path: reports/ci/
